<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="marketApp app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="0.52" stop-color="#35cfc2"/>
      <stop offset="1" stop-color="#86e88a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35cfc2" stop-opacity="0.26"/>
      <stop offset="0.85" stop-color="#35cfc2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78c8ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#2ec4b6" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eafff6"/>
      <stop offset="0.32" stop-color="#9bf0a3"/>
      <stop offset="0.7" stop-color="#86e88a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#86e88a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g stroke="#ffffff" fill="none">
    <line x1="66" y1="224" x2="448" y2="224" stroke-opacity="0.05"/>
    <line x1="66" y1="312" x2="448" y2="312" stroke-opacity="0.05"/>
    <line x1="66" y1="132" x2="448" y2="132" stroke-opacity="0.05"/>
    <line x1="66" y1="400" x2="448" y2="400" stroke-opacity="0.14" stroke-width="2"/>
  </g>

  <path d="M84,398 C168,396 232,384 288,344 C340,306 372,232 404,132 L404,400 L84,400 Z" fill="url(#area)"/>

  <g fill="url(#bar)">
    <rect x="100" y="390" width="24" height="10" rx="5"/>
    <rect x="148" y="380" width="24" height="20" rx="5"/>
    <rect x="196" y="366" width="24" height="34" rx="5"/>
    <rect x="244" y="346" width="24" height="54" rx="5"/>
    <rect x="292" y="316" width="24" height="84" rx="5"/>
    <rect x="340" y="280" width="24" height="120" rx="5"/>
  </g>

  <path d="M84,398 C168,396 232,384 288,344 C340,306 372,232 404,132"
        fill="none" stroke="url(#curve)" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <circle cx="404" cy="132" r="30" fill="url(#node)"/>
  <circle cx="404" cy="132" r="16" fill="none" stroke="#9bf0a3" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="404" cy="132" r="9.5" fill="#f2fff8"/>
